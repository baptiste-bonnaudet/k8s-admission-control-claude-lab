apiVersion: v1
kind: Pod
metadata:
  name: cel-bad-privileged
  namespace: cel-lab
  labels:
    app.kubernetes.io/name: cel-bad-privileged
    app.kubernetes.io/part-of: policy-lab
    owner: platform-security
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
