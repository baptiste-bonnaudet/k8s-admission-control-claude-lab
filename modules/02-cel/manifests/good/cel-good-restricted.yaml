apiVersion: v1
kind: Pod
metadata:
  name: cel-good-restricted
  namespace: cel-lab
  labels:
    app.kubernetes.io/name: cel-good-restricted
    app.kubernetes.io/part-of: policy-lab
    owner: platform-security
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
