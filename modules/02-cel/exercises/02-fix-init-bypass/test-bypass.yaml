apiVersion: v1
kind: Pod
metadata:
  name: test-init-bypass
  namespace: cel-lab
  labels:
    app.kubernetes.io/name: test-init-bypass
    app.kubernetes.io/part-of: policy-lab
    owner: platform-security
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: init-setup
      image: python:3.12-slim
      command: ["sh", "-c", "echo init done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
