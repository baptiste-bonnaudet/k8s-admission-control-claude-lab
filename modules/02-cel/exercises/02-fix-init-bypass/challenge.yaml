apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: challenge-registry-containers-only.lab.example.com
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c,
          c.image.startsWith('registry.k8s.io/')
          || c.image.startsWith('nginxinc/')
        )
      message: "Container images must come from approved registries."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: challenge-registry-containers-only-binding.lab.example.com
spec:
  policyName: challenge-registry-containers-only.lab.example.com
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        admission.lab.example.com/cel-lab: "true"
