apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-hostpath.lab.example.com
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        !has(object.spec.volumes)
        || object.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are not allowed."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-hostpath-binding.lab.example.com
spec:
  policyName: disallow-hostpath.lab.example.com
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        admission.lab.example.com/cel-lab: "true"
