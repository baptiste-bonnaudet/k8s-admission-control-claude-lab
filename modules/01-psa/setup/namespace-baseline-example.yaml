# This namespace demonstrates the baseline PSS profile.
# baseline prevents known privilege escalation patterns while remaining
# broadly compatible with most workloads.
# Use this as a reference for teams that cannot yet meet restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-example
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
