apiVersion: v1
kind: Pod
metadata:
  name: gatekeeper-bad-registry
  namespace: gatekeeper-lab
  labels:
    app.kubernetes.io/name: gatekeeper-bad-registry
    owner: platform-security
    env: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: python:3.12-slim
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
