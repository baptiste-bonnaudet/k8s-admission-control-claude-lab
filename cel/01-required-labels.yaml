apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: required-workload-labels.baptiste.dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  validations:
    - expression: >
        has(object.metadata.labels)
        && 'app.kubernetes.io/name' in object.metadata.labels
        && 'app.kubernetes.io/part-of' in object.metadata.labels
        && 'owner' in object.metadata.labels
        && 'env' in object.metadata.labels
      message: "Workloads must include labels: app.kubernetes.io/name, app.kubernetes.io/part-of, owner, and env."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: required-workload-labels-binding.baptiste.dev
spec:
  policyName: required-workload-labels.baptiste.dev
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        admission.baptiste.dev/cel-lab: "true"
