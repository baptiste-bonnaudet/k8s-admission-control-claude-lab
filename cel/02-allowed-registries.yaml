apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allowed-registries.baptiste.dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c,
          c.image.startsWith('registry.k8s.io/')
          || c.image.startsWith('nginxinc/')
          || c.image.startsWith('ghcr.io/kyverno/')
        )
        &&
        (!has(object.spec.initContainers)
          || object.spec.initContainers.all(c,
            c.image.startsWith('registry.k8s.io/')
            || c.image.startsWith('nginxinc/')
            || c.image.startsWith('ghcr.io/kyverno/')
          )
        )
        &&
        (!has(object.spec.ephemeralContainers)
          || object.spec.ephemeralContainers.all(c,
            c.image.startsWith('registry.k8s.io/')
            || c.image.startsWith('nginxinc/')
            || c.image.startsWith('ghcr.io/kyverno/')
          )
        )
      message: "Container images must come from approved registries: registry.k8s.io/, nginxinc/, or ghcr.io/kyverno/."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: allowed-registries-binding.baptiste.dev
spec:
  policyName: allowed-registries.baptiste.dev
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        admission.baptiste.dev/cel-lab: "true"
